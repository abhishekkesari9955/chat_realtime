
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ConnectSafe</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101828, #164e63);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 16px;
        }

        h1 {
            color: #0f766e;
            text-align: center;
        }

        p {
            color: #475569;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            text-align: center;
        }

        a {
            color: #0f766e;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome Back</h1>
        <p>Login to your ConnectSafe account.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p class="footer">
            New here?
            <a href="{% url 'register' %}">Create an account</a>
        </p>
    </main>
</body>
</html>
