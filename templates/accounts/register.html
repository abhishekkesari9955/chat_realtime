
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ConnectSafe</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101828, #164e63);
            color: #1f2937;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 8px;
            color: #0f766e;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 24px;
            color: #64748b;
            text-align: center;
        }

        form p {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        input:focus {
            outline: 2px solid #0d9488;
            border-color: transparent;
        }

        .helptext, ul {
            color: #64748b;
            font-size: 12px;
        }

        .errorlist {
            color: #b91c1c;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>ConnectSafe</h1>
        <p class="subtitle">Create your secure account</p>

        {% if messages %}
            {% for message in messages %}
                <p role="status">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>

        <p class="footer">
            Your account information is handled securely.
        </p>
    </main>
</body>
</html>
