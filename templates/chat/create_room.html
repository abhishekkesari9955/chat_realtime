
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Chat Room | ConnectSafe</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101828, #164e63);
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background: white;
            border-radius: 16px;
        }

        h1 {
            color: #0f766e;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .errors {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Create a Chat Room</h1>
        <p>Set up a space for your team or friends.</p>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                {{ field }}

                {% if field.errors %}
                    <div class="errors">{{ field.errors }}</div>
                {% endif %}
            {% endfor %}

            <button type="submit">Create Room</button>
        </form>
    </main>
</body>
</html>
