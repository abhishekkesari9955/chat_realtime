
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member | {{ room.name }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #0b1120;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .panel {
            background: #172033;
            border: 1px solid #29364d;
            padding: 24px;
            border-radius: 14px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #a5b4cc;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0b1120;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 8px;
        }

        button {
            margin-top: 18px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #2dd4bf;
            color: #042f2e;
            font-weight: bold;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #5eead4;
            text-decoration: none;
        }

        .empty {
            padding: 12px;
            background: #263449;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <main class="container">
        <a class="back-link"
           href="{% url 'room_detail' room.id %}">
            ← Back to chat
        </a>

        <section class="panel">
            <h1>Add a room member</h1>

            <p>
                Room: <strong>{{ room.name }}</strong>
            </p>

            {% if available_users %}
                <form method="post">
                    {% csrf_token %}

                    <label for="user_id">
                        Select a registered user
                    </label>

                    <select id="user_id" name="user_id" required>
                        <option value="">-- Choose a user --</option>

                        {% for user in available_users %}
                            <option value="{{ user.pk }}">
                                {{ user.display_name|default:user.username }}
                                ({{ user.username }})
                            </option>
                        {% endfor %}
                    </select>

                    <button type="submit">Add member</button>
                </form>
            {% else %}
                <p class="empty">
                    No other users are available to add.
                </p>
            {% endif %}
        </section>
    </main>
</body>
</html>
